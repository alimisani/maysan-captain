name: maysan_captain
description: "تطبيق كابتن ميسان لتوصيل الركاب والطلبات في محافظة ميسan وأقضيتها"
publish_to: 'none'
version: 1.0.0+16

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend & Database
  supabase_flutter: ^2.8.3

  # State Management
  provider: ^6.1.2

  # Cross-platform Maps & Routing
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Invoice PDF & Printing
  pdf: ^3.11.1
  printing: ^5.13.3

  # External Links & WhatsApp
  url_launcher: ^6.3.1
  geolocator: ^13.0.2

  # Utilities & Formatting
  intl: ^0.20.2
  http: ^1.2.2
  crypto: ^3.0.6
  shared_preferences: ^2.3.5
  flutter_animate: ^4.5.2
  uuid: ^4.5.1
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  image: ^4.3.0
  flutter_local_notifications: ^17.2.3
  audioplayers: ^6.1.0
  flutter_background_service: ^5.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/app.png"
    background_color: "#0a0f1d"
    theme_color: "#0ea5e9"
  windows:
    generate: true
    image_path: "assets/icon/app.png"
    icon_size: 256
  linux:
    generate: true
    image_path: "assets/icon/app.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/fonts/
    - assets/sounds/

  fonts:
    - family: ReadexPro
      fonts:
        - asset: assets/fonts/ReadexPro-Regular.ttf
        - asset: assets/fonts/ReadexPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/ReadexPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ReadexPro-Bold.ttf
          weight: 700
        - asset: assets/fonts/ReadexPro-Light.ttf
          weight: 300
        - asset: assets/fonts/ReadexPro-ExtraLight.ttf
          weight: 200

    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Cairo-Black.ttf
          weight: 900
        - asset: assets/fonts/Cairo-Light.ttf
          weight: 300

    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700

    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
        - asset: assets/fonts/Amiri-Italic.ttf
          style: italic
        - asset: assets/fonts/Amiri-BoldItalic.ttf
          weight: 700
          style: italic

    - family: AdobeArabic
      fonts:
        - asset: assets/fonts/AdobeArabic-Regular.ttf
        - asset: assets/fonts/AdobeArabic-Bold.ttf
          weight: 700

    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700
