<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="تطبيق كابتن ميسان لتوصيل الركاب والطلبات في محافظة ميسان وأقضيتها ونواحيها">
  <meta name="theme-color" content="#0ea5e9">

  <!-- iOS Meta Tags & PWA Capabilities -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="كابتن ميسان">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Apple Touch Icons -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>كابتن ميسان | Maysan Captain</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // 1. Immediately delete all caches stored by previous service workers
    if (typeof caches !== 'undefined') {
      caches.keys().then(function(names) {
        for (var i = 0; i < names.length; i++) {
          caches.delete(names[i]);
        }
      });
    }

    // 2. Force unregister every existing service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
      navigator.serviceWorker.addEventListener('controllerchange', function() {
        window.location.reload();
      });
    }

    // 3. Check version.json and force refresh if new build detected
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function(res) { return res.json(); })
      .then(function(info) {
        var currentBuild = (info && info.build_number) ? info.build_number : '23';
        var storedBuild = localStorage.getItem('pwa_build_number');
        if (storedBuild && storedBuild !== currentBuild) {
          localStorage.setItem('pwa_build_number', currentBuild);
          if (typeof caches !== 'undefined') {
            caches.keys().then(function(names) {
              names.forEach(function(n) { caches.delete(n); });
            });
          }
          window.location.reload(true);
        } else {
          localStorage.setItem('pwa_build_number', currentBuild);
        }
      }).catch(function() {});
  </script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0a0f1d;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .logo {
      width: 86px;
      height: 86px;
      border-radius: 22px;
      box-shadow: 0 10px 25px rgba(14, 165, 233, 0.35);
      animation: pulse 2s infinite ease-in-out;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #0ea5e9;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .title {
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <img class="logo" src="icons/Icon-192.png" alt="كابتن ميسان">
    <div class="title">كابتن ميسان</div>
    <div class="spinner"></div>
  </div>

  <script>
    // Dynamically inject flutter_bootstrap.js with cache-busting timestamp
    var script = document.createElement('script');
    script.src = 'flutter_bootstrap.js?t=' + new Date().getTime();
    script.async = true;
    document.body.appendChild(script);
  </script>
</body>
</html>
