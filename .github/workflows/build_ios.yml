name: Build & Release iOS (App Store & Simulator)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-ios:
    name: Build iOS AppStore & Simulator
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build iOS Simulator App (for Browser & Simulator Testing)
        run: |
          flutter build ios --simulator --no-codesign
          cd build/ios/iphonesimulator
          zip -r ../../../Maysan-Captain-iOS-Simulator.zip Runner.app
          cd ../../..

      - name: Build iOS Release Package (IPA)
        run: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../../Maysan-Captain-iOS-Release.ipa Payload
          cd ../../..

      - name: Upload iOS Simulator Zip (Appetize / Simulator)
        uses: actions/upload-artifact@v4
        with:
          name: Maysan-Captain-iOS-Simulator
          path: Maysan-Captain-iOS-Simulator.zip

      - name: Upload iOS Release IPA (iPhone Package)
        uses: actions/upload-artifact@v4
        with:
          name: Maysan-Captain-iOS-Release-IPA
          path: Maysan-Captain-iOS-Release.ipa
