name: Build & Release iOS (App Store & Simulator)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-ios:
    name: Build iOS IPA & Simulator
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS Simulator (for Appetize.io & Browser Testing)
        run: |
          flutter build ios --simulator --release
          cd build/ios/iphonesimulator
          zip -r ../../../Maysan_Captain_Simulator.zip Runner.app
          cd ../../..

      - name: Build iOS Archive (for App Store)
        run: |
          flutter build ipa --no-codesign --release

      - name: Upload Appetize Simulator Zip
        uses: actions/upload-artifact@v4
        with:
          name: Maysan-Captain-iOS-Simulator
          path: Maysan_Captain_Simulator.zip

      - name: Upload App Store Archive
        uses: actions/upload-artifact@v4
        with:
          name: Maysan-Captain-iOS-AppStore
          path: build/ios/archive/Runner.xcarchive
