name: Build & Release iOS (App Store & Simulator)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-ios:
    name: Build iOS AppStore & Simulator
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Configure CocoaPods & Generate iOS Project
        run: |
          flutter build ios --config-only
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS Simulator App (for Browser & Simulator Testing)
        run: |
          flutter build ios --simulator --no-codesign
          cd build/ios/iphonesimulator
          zip -r ../../../Maysan-Captain-iOS-Simulator.zip Runner.app
          cd ../../..

      - name: Build iOS Release Package
        run: |
          flutter build ios --release --no-codesign

      - name: Upload iOS Simulator Zip (Appetize / Simulator)
        uses: actions/upload-artifact@v4
        with:
          name: Maysan-Captain-iOS-Simulator
          path: Maysan-Captain-iOS-Simulator.zip

      - name: Upload iOS Release Bundle (Runner.app)
        uses: actions/upload-artifact@v4
        with:
          name: Maysan-Captain-iOS-Release
          path: build/ios/iphoneos/Runner.app
